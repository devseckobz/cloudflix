name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
      - name: Install frontend dependencies
        run: npm install --prefix frontend
      - name: Check frontend
        run: npm run check --prefix frontend
      - name: Build Svelte frontend into embedded assets
        run: npm run build --prefix frontend
      - name: Resolve Go modules
        run: go mod tidy
      - name: Test backend
        run: go test ./...
      - name: Vet backend
        run: go vet ./...
      - name: Validate deployment shell scripts
        run: bash -n installer/install.sh installer/update.sh installer/pin.sh installer/uninstall.sh
      - name: Compile Linux binary
        run: CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=dev" -o /tmp/cloudflix ./cmd/cloudflix
