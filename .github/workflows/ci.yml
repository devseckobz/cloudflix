name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflix-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
      - name: Install frontend dependencies
        run: npm install --prefix frontend
      - name: Check frontend
        run: npm run check --prefix frontend
      - name: Test PIN login UI
        run: npm test --prefix frontend
      - name: Build Svelte frontend into embedded assets
        run: npm run build --prefix frontend
      - name: Resolve Go modules
        run: go mod tidy
      - name: Test backend
        run: go test ./...
      - name: Vet backend
        run: go vet ./...
      - name: Validate deployment shell scripts
        run: bash -n installer/install.sh installer/update.sh installer/pin.sh installer/uninstall.sh installer/setup-web-updater.sh installer/web-update-worker.sh
      - name: Verify installer refuses occupied port 80
        run: |
          set -euo pipefail
          mock="$(mktemp -d)"
          trap 'rm -rf "$mock"' EXIT
          cat > "$mock/ss" <<'SH'
          #!/bin/bash
          printf 'LISTEN 0 128 0.0.0.0:80 0.0.0.0:* users:(("nginx",pid=567,fd=3))\n'
          SH
          chmod 0755 "$mock/ss"
          set +e
          output="$(sudo env PATH="$mock:$PATH" bash installer/install.sh 2>&1)"
          result=$?
          set -e
          echo "$output"
          test "$result" -ne 0
          grep -Fq 'TCP port 80 is already in use' <<< "$output"
          grep -Fq 'nginx' <<< "$output"
          grep -Fq 'pid=567' <<< "$output"
          test ! -e /etc/systemd/system/cloudflix.service
      - name: Verify updater candidate is accessible to a non-root account
        run: |
          set -euo pipefail
          root_tmp="$(sudo mktemp -d)"
          accessible="$(sudo mktemp -d /run/cloudflix-stage.XXXXXXXX)"
          trap 'sudo rm -rf "$root_tmp" "$accessible"' EXIT
          sudo install -m 0755 /bin/true "$root_tmp/candidate"
          sudo install -m 0755 /bin/true "$accessible/candidate"
          sudo chmod 0755 "$accessible"
          sudo runuser -u nobody -- "$accessible/candidate"
          grep -Fq '"$BIN.new" pin status' installer/update.sh
          ! grep -Fq '"$work/cloudflix.candidate" pin status' installer/update.sh
      - name: Verify web updates only trigger fixed root-owned helper
        run: |
          set -euo pipefail
          grep -Fq 'PathExists=/var/lib/cloudflix/update.request' installer/setup-web-updater.sh
          grep -Fq 'ExecStart=/usr/local/libexec/cloudflix/web-update-worker.sh' installer/setup-web-updater.sh
          grep -Fq 'CLOUDFLIX_NONINTERACTIVE=1' installer/web-update-worker.sh
          grep -Fq 'systemctl enable --now cloudflix-update.path' installer/setup-web-updater.sh
      - name: Verify destructive uninstaller never prompts
        run: |
          set -euo pipefail
          if grep -Fq '/dev/tty' installer/uninstall.sh || grep -Fq 'DELETE CLOUDFLIX' installer/uninstall.sh;then
            echo "Uninstaller unexpectedly contains interactive confirmation"
            exit 1
          fi
          grep -Fq 'CLOUDFLIX_KEEP_DATA' installer/uninstall.sh
      - name: Compile Linux binary
        run: CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=dev" -o /tmp/cloudflix ./cmd/cloudflix
